name: CI

permissions:
  contents: read
  issues: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/qa_management_test
      JWT_SECRET: ci-only-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix packages/contracts run build
      - run: npm run validate
      - run: npm run quality:test
      - run: npm run quality:check -- --base "${QUALITY_BASE_REF}"
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run sdlc:check -- --base "${SDLC_BASE_REF}"
        env:
          SDLC_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm --prefix apps/api run typecheck
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/api run db:migrate:test
      - run: npm --prefix apps/api run test:integration
      - run: npm --prefix packages/contracts run test
      - run: npm --prefix apps/web run test
      - run: npm --prefix apps/web run build
      # ADR-039: last, so every other result is visible. Fails a pull request while the tree has
      # migrations that Production (read from its public health check) has not applied yet.
      - name: Production migrations applied before merge
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        run: npm run migrations:prod:check

  e2e:
    # Browser end-to-end specs (audit E1): real API + Vite against a disposable PostgreSQL database.
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-only-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix packages/contracts run build
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
          retention-days: 7
